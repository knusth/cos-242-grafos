<rect x="14.0" y="224.0" width="304.0" height="58.0" fill="#ffffff" stroke="#0f6260" stroke-width="1.1" rx="4"/>
<text x="24.0" y="243.0" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">A → B → C:  2 + (−2) = 0   (2 arestas)</text>
<text x="24.0" y="259.0" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">A → C:      1               (1 aresta)</text>
<text x="24.0" y="275.0" font-size="10.5" fill="#0f6260" text-anchor="start" font-weight="700">✓ Mínimo real é A → B → C (custo 0)</text>
<rect x="354.0" y="0.0" width="332.0" height="294.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" rx="5"/>
<rect x="354.0" y="0.0" width="332.0" height="4.5" fill="#9f1239" stroke="none" stroke-width="1.0"/>
<text x="370.0" y="28.0" font-size="12.6" fill="#9f1239" text-anchor="start" font-weight="700">2. Somar +2 em toda aresta (FALHA!)</text>
<text x="370.0" y="46.0" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">Penaliza caminhos com mais arestas</text>
<line x1="440.1" y1="171.9" x2="504.4" y2="107.6" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="433.0" y="122.0" width="32.0" height="20.0" fill="#ffffff" stroke="#64748b" stroke-width="1.1" rx="3"/>
<text x="449.0" y="136.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">4</text>
<line x1="534.1" y1="106.1" x2="598.4" y2="170.4" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="575.0" y="122.0" width="32.0" height="20.0" fill="#ffffff" stroke="#64748b" stroke-width="1.1" rx="3"/>
<text x="591.0" y="136.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">0</text>
