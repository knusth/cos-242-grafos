<circle cx="426.0" cy="186.0" r="18.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="426.0" y="190.5" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">A</text>
<circle cx="520.0" cy="92.0" r="18.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="520.0" y="96.5" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">B</text>
<circle cx="614.0" cy="186.0" r="18.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="614.0" y="190.5" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">C</text>
<rect x="368.0" y="224.0" width="304.0" height="58.0" fill="#ffffff" stroke="#9f1239" stroke-width="1.1" rx="4"/>
<text x="378.0" y="243.0" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">A → B → C:  4 + 0 = 4   (+4 por 2 arestas!)</text>
<text x="378.0" y="259.0" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">A → C:      3           (+2 por 1 aresta)</text>
<text x="378.0" y="275.0" font-size="10.5" fill="#9f1239" text-anchor="start" font-weight="700">× ERRO: inverteu o mínimo para A → C!</text>
<rect x="708.0" y="0.0" width="332.0" height="294.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0" rx="5"/>
<rect x="708.0" y="0.0" width="332.0" height="4.5" fill="#0f6260" stroke="none" stroke-width="1.0"/>
<text x="724.0" y="28.0" font-size="12.6" fill="#0f6260" text-anchor="start" font-weight="700">3. Potencial h de Johnson (CORRETO)</text>
<text x="724.0" y="46.0" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">w'(u,v) = w(u,v) + h(v) − h(u) ≥ 0</text>
<line x1="794.1" y1="171.9" x2="858.4" y2="107.6" stroke="#0f6260" stroke-width="2.6" marker-end="url(#arr-teal)"/>
<rect x="787.0" y="122.0" width="32.0" height="20.0" fill="#ffffff" stroke="#0f6260" stroke-width="1.1" rx="3"/>
<text x="803.0" y="136.0" font-size="11.5" fill="#0f6260" text-anchor="middle" font-weight="700">0</text>
<line x1="888.1" y1="106.1" x2="952.4" y2="170.4" stroke="#0f6260" stroke-width="2.6" marker-end="url(#arr-teal)"/>
<rect x="929.0" y="122.0" width="32.0" height="20.0" fill="#ffffff" stroke="#0f6260" stroke-width="1.1" rx="3"/>
<text x="945.0" y="136.0" font-size="11.5" fill="#0f6260" text-anchor="middle" font-weight="700">0</text>
<line x1="800.0" y1="186.0" x2="946.0" y2="186.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-ink)"/>
<rect x="858.0" y="195.0" width="32.0" height="20.0" fill="#ffffff" stroke="#64748b" stroke-width="1.1" rx="3"/>
<text x="874.0" y="209.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">1</text>
<circle cx="780.0" cy="186.0" r="18.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="780.0" y="190.5" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">A</text>
<text x="780.0" y="217.0" font-size="10.2" fill="#b45309" text-anchor="middle" font-weight="700">h=0</text>
<circle cx="874.0" cy="92.0" r="18.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="874.0" y="96.5" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">B</text>
<text x="874.0" y="66.0" font-size="10.2" fill="#b45309" text-anchor="middle" font-weight="700">h=−2</text>
<circle cx="968.0" cy="186.0" r="18.0" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
<text x="968.0" y="190.5" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">C</text>
<text x="968.0" y="217.0" font-size="10.2" fill="#b45309" text-anchor="middle" font-weight="700">h=0</text>
<rect x="722.0" y="224.0" width="304.0" height="58.0" fill="#ffffff" stroke="#0f6260" stroke-width="1.1" rx="4"/>
<text x="732.0" y="243.0" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">A → B → C:  0 + 0 = 0   (+h(B)−h(B) cancela!)</text>
<text x="732.0" y="259.0" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">A → C:      1           (mesmo +h(C)−h(A))</text>
<text x="732.0" y="275.0" font-size="10.5" fill="#0f6260" text-anchor="start" font-weight="700">✓ Pesos ≥ 0 e ordem 100% preservada!</text>
<rect x="0.0" y="310.0" width="1040.0" height="76.0" fill="#ffffff" stroke="#1b365d" stroke-width="1.3" rx="5"/>
<rect x="0.0" y="310.0" width="6.0" height="76.0" fill="#1b365d" stroke="none" stroke-width="1.0"/>
<text x="22.0" y="334.0" font-size="11.8" fill="#1b365d" text-anchor="start" font-weight="700">Por que a soma telescópica funciona para qualquer caminho P = (s → v₁ → … → t):</text>
<text x="22.0" y="355.0" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="600">w'(P) = w(P) + (h(v₁) − h(s)) + (h(v₂) − h(v₁)) + … + (h(t) − h(vₖ)) = w(P) + h(t) − h(s)   →   independe do nº de arestas!</text>
<text x="22.0" y="374.0" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">Como achar h? Rodando 1 único Bellman-Ford até um vértice virtual q (no W₁ detecta ciclo e aborta; em W₂–W₅ pesos ≥ 0 já dão h = 0).</text>
</svg>
