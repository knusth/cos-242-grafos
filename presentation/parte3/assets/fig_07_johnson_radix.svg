<rect x="0.0" y="0.0" width="332.0" height="4.5" fill="#1b365d" stroke="none" stroke-width="1.0"/>
<text x="16.0" y="28.0" font-size="12.6" fill="#1b365d" text-anchor="start" font-weight="700">1. Grafo original (peso negativo)</text>
<text x="16.0" y="46.0" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">Dijkstra falha na aresta B → C = −2</text>
