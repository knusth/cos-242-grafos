<text x="18.0" y="28.0" font-size="13.5" fill="#1b365d" text-anchor="start" font-weight="700">A. As duas otimizações do Bellman-Ford</text>
<text x="18.0" y="47.0" font-size="11" fill="#475569" text-anchor="start" font-weight="400">Por que não precisamos varrer todas as E arestas em V−1 rodadas</text>
<rect x="18.0" y="66.0" width="464.0" height="90.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0" rx="5"/>
<rect x="18.0" y="66.0" width="4.5" height="90.0" fill="#9f1239" stroke="none" stroke-width="1.0"/>
<text x="34.0" y="88.0" font-size="12" fill="#9f1239" text-anchor="start" font-weight="700">BF Clássico (sem otimizações)</text>
<text x="34.0" y="108.0" font-size="10.8" fill="#475569" text-anchor="start" font-weight="400">• Roda todas as V − 1 rodadas fixas (24.999 no W₂).</text>
<text x="34.0" y="126.0" font-size="10.8" fill="#475569" text-anchor="start" font-weight="400">• Testa TODAS as E arestas toda rodada, mesmo sem mudança.</text>
<text x="34.0" y="144.0" font-size="10.8" fill="#9f1239" text-anchor="start" font-weight="700">→ 20,6 bilhões de relaxações por destino no W₂!</text>
<rect x="18.0" y="170.0" width="464.0" height="114.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0" rx="5"/>
<rect x="18.0" y="170.0" width="4.5" height="114.0" fill="#0f6260" stroke="none" stroke-width="1.0"/>
<text x="34.0" y="192.0" font-size="12" fill="#0f6260" text-anchor="start" font-weight="700">1. Lista de ativos (fronteira que realmente mudou)</text>
<text x="34.0" y="212.0" font-size="10.8" fill="#475569" text-anchor="start" font-weight="400">• Se a distância de v não melhorou na rodada r, relaxar</text>
<text x="42.0" y="228.0" font-size="10.8" fill="#475569" text-anchor="start" font-weight="400">suas arestas de entrada u → v na rodada r + 1 é inútil.</text>
<text x="34.0" y="248.0" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">• Guardamos em active[] só quem melhorou (bitmask evita</text>
<text x="42.0" y="264.0" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">duplicatas) e varremos só backward_[v] na próxima rodada.</text>
<rect x="18.0" y="298.0" width="464.0" height="74.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0" rx="5"/>
<rect x="18.0" y="298.0" width="4.5" height="74.0" fill="#1b365d" stroke="none" stroke-width="1.0"/>
<text x="34.0" y="320.0" font-size="12" fill="#1b365d" text-anchor="start" font-weight="700">2. Parada antecipada</text>
<text x="34.0" y="340.0" font-size="10.8" fill="#475569" text-anchor="start" font-weight="400">• Quando active[] fica vazia, nenhuma distância pode mais</text>
<text x="42.0" y="356.0" font-size="10.8" fill="#1b365d" text-anchor="start" font-weight="700">diminuir → encerra na rodada 24 (em vez de 24.999)!</text>
<text x="542.0" y="28.0" font-size="13.5" fill="#0f6260" text-anchor="start" font-weight="700">B. A lista de ativos em ação no W₂ (destino 100)</text>
<text x="542.0" y="47.0" font-size="11" fill="#475569" text-anchor="start" font-weight="400">Começa em 1 vértice (100), sobe a 19.529 (78%) e zera na rodada 24</text>
